    <script type="importmap">
      {

  <body class="bg-[#F5F3EF] text-[#2D2A26] antialiased selection:bg-[#B85C4F]/20 selection:text-[#B85C4F]">
    <div id="root"></div>

    <script type="module">
      import React, { useState, useEffect, useCallback, createContext, useContext, useRef } from 'react';
      import ReactDOM from 'react-dom/client';
      import * as Icons from 'lucide-react';

      // --- 設定 & 定数 ---
      const CONFIG = {
        gasUrl: 'https://script.google.com/macros/s/AKfycbyJ3hekrxoYNuNoYL6MU55wcAajbkqfrtmFqcCwD4_xb2hiWQMlaGMbqrMhNNeQYms0/exec',
        appName: 'デートプラン管理',
      };

      const CATEGORIES = [
        { category_id: 'cafe', display_name: 'カフェ', icon: 'Coffee', color: '#8B6914' },
        { category_id: 'lunch', display_name: 'ランチ', icon: 'Utensils', color: '#D4A574' },
        { category_id: 'dinner', display_name: 'ディナー', icon: 'Wine', color: '#B85C4F' },
        { category_id: 'movie', display_name: '映画', icon: 'Film', color: '#7B6B8D' },
        { category_id: 'shopping', display_name: 'ショッピング', icon: 'ShoppingBag', color: '#C97B8D' },
        { category_id: 'walk', display_name: '散策', icon: 'Footprints', color: '#6B9B7A' },
        { category_id: 'drive', display_name: 'ドライブ', icon: 'Car', color: '#5A7D8C' },
        { category_id: 'night_view', display_name: '夜景', icon: 'Sparkles', color: '#4A6572' },

        { category_id: 'other', display_name: 'その他', icon: 'MapPin', color: '#A8A29E' }

      const CATEGORY_MAP = Object.fromEntries(CATEGORIES.map(c => [c.category_id, c]));

      const PREFECTURES = ['東京都','神奈川県','埼玉県','千葉県','大阪府','京都府','兵庫県','北海道','愛知県','福岡県'];
      const THEMES = ['カフェ','ランチ','ディナー','映画','ショッピング','散策','ドライブ','夜景','アクティビティ','記念日','公園・自然'];

      // --- ユーティリティ ---
      function normalizeDate(d) {
        if (!d) return '';
        if (d instanceof Date && !isNaN(d.getTime())) {
          const y = d.getFullYear();
          const m = String(d.getMonth() + 1).padStart(2, '0');
          const day = String(d.getDate()).padStart(2, '0');
          return `${y}-${m}-${day}`;
        }
        if (typeof d === 'string') {
          const trimmed = d.trim();
          if (/^\d{4}-\d{2}-\d{2}$/.test(trimmed)) return trimmed;
          const match = trimmed.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
          if (match) {
            const y = match[1];
            const m = match[2].padStart(2, '0');
            const day = match[3].padStart(2, '0');
            return `${y}-${m}-${day}`;
          }
          try {
            const dt = new Date(trimmed);
            if (!isNaN(dt.getTime())) {
              const y = dt.getFullYear();
              const m = String(dt.getMonth() + 1).padStart(2, '0');
              const day = String(dt.getDate()).padStart(2, '0');
              return `${y}-${m}-${day}`;
            }
          } catch(e){}
          return trimmed.substring(0, 10);
        }
        return '';
      }

      function addMinutesToTime(timeStr, mins) {
        if (!timeStr || !timeStr.includes(':')) timeStr = '11:00';
        const [h, m] = timeStr.split(':').map(Number);
        const total = (h || 0) * 60 + (m || 0) + mins;
        const nh = Math.floor(total / 60) % 24;
        const nm = total % 60;
        return `${String(nh).padStart(2, '0')}:${String(nm).padStart(2, '0')}`;
      }

      function recalculateScheduleTimes(spots, startTime = '11:00') {
        let current = startTime || '11:00';
        return spots.map((s, idx) => {
          const item = { ...s, spot_order: idx + 1, start_time: current };
          const span = (s.duration_min || 60) + (s.transit_min || 15);
          current = addMinutesToTime(current, span);
          return item;
        });
      }

      function formatDateDisplay(d) {
        if (!d) return '';
        const norm = normalizeDate(d);
        try {
          const [y, m, day] = norm.split('-').map(Number);
          const dt = new Date(y, m - 1, day);
          const week = ['日','月','火','水','木','金','土'][dt.getDay()];
          return `${m}月${day}日(${week})`;
        } catch {
          return norm;
        }
      }

      function formatYen(n) {
        return `¥${(n || 0).toLocaleString('ja-JP')}`;
      }

      // --- ストレージ & API ---
      const STORAGE_KEYS = {
        PLANS: 'dp_plans_v3',
        SCHEDULES: 'dp_schedules_v3',
        WISHLIST: 'dp_wishlist_v3',
        USER: 'dp_user_v3'
      };

      const INITIAL_PLANS = [
        {
          plan_id: 'plan_sample_01',
          title: '渋谷・代官山 秋のカフェ＆夜景デート',
          date: '2026-10-10',
          start_time: '11:30',
          prefecture: '東京都',
          area: '渋谷・代官山',
          budget_limit: 18000,
          theme: 'カフェ,散策,ディナー,夜景',
          description: '行きたかった隠れ家カフェからスタートし、代官山をお散歩。夕方は渋谷スカイの絶景を楽しみ、夜は落ち着いたビストロへ。',
          thumbnail_url: 'https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=600&auto=format&fit=crop&q=80',
          status: 'planned',
          last_modified_by: '彼氏',
          last_modified_at: new Date().toISOString()
        }
      ];

      const INITIAL_SCHEDULES = {
        plan_sample_01: [
          { schedule_id: 'sch_1', plan_id: 'plan_sample_01', spot_order: 1, start_time: '11:30', duration_min: 75, transit_min: 15, spot_name: 'FUGLEN TOKYO (カフェ)', category: 'cafe', address: '東京都渋谷区富ヶ谷1-16-11', lat: 35.6668, lng: 139.6922, budget_per_person: 900, budget_for_two: 1800, budget_input_type: 'per_person', memo: 'テラス席がおすすめ。ノルウェー風ワッフル', image_url: 'https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?w=400&auto=format&fit=crop&q=80' },
          { schedule_id: 'sch_2', plan_id: 'plan_sample_01', spot_order: 2, start_time: '13:00', duration_min: 90, transit_min: 20, spot_name: '代官山 蔦屋書店 & 散策', category: 'walk', address: '東京都渋谷区猿楽町17-5', lat: 35.649, lng: 139.7022, budget_per_person: 600, budget_for_two: 1200, budget_input_type: 'per_person', memo: 'アート本や文具を一緒に見て、外のベンチでひと休み', image_url: 'https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?w=400&auto=format&fit=crop&q=80' }
        ]
      };

      const INITIAL_WISHLIST = [
        { wish_id: 'wish_1', spot_name: 'ブルーボトルコーヒー 中目黒', category: 'cafe', address: '東京都目黒区中目黒3-23-16', lat: 35.6391, lng: 139.7001, estimated_budget_for_two: 1800, memo: '目黒川のお散歩とセットで行きたい', tag: 'カフェ巡り', last_modified_by: '彼女' }
      ];

      function getLocal(key, def) {
        try {
          const v = localStorage.getItem(key);
          return v ? JSON.parse(v) : def;
        } catch { return def; }
      }
      function setLocal(key, val) {
        try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
      }

      let cachedPlans = getLocal(STORAGE_KEYS.PLANS, INITIAL_PLANS);
      let cachedSchedules = getLocal(STORAGE_KEYS.SCHEDULES, INITIAL_SCHEDULES);
      let cachedWishlist = getLocal(STORAGE_KEYS.WISHLIST, INITIAL_WISHLIST);
      let currentUser = getLocal(STORAGE_KEYS.USER, '彼氏');

      // GAS通信
      async function callGas(action, method = 'GET', data = {}) {
        if (!CONFIG.gasUrl || CONFIG.gasUrl.includes('YOUR_GAS_ID')) return { success: false };
        try {
          if (method === 'GET') {
            const url = `${CONFIG.gasUrl}?${new URLSearchParams({ action, ...data })}`;
            const res = await fetch(url);
            if (res.ok) return await res.json();
          } else {
            const res = await fetch(CONFIG.gasUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({ action, ...data })
            });
            if (res.ok) return await res.json();
          }
        } catch (e) {
          console.warn('GAS call error:', e);
        }
        return { success: false };
      }

      async function fetchPlans() {
        callGas('getPlans', 'GET').then(res => {
          if (res?.success && Array.isArray(res.plans)) {
            cachedPlans = res.plans.map(p => {
              const prev = cachedPlans.find(cp => cp.plan_id === p.plan_id);
              const resolvedDate = normalizeDate(p.date) || normalizeDate(prev?.date) || '';
              const resolvedStartTime = p.start_time || prev?.start_time || '11:00';
              return {
                ...p,
                date: resolvedDate,
                start_time: resolvedStartTime,
                last_modified_by: p.last_modified_by || prev?.last_modified_by || '彼氏'
              };
            });
            setLocal(STORAGE_KEYS.PLANS, cachedPlans);
            res.plans.forEach(p => {
              if (p.schedule && Array.isArray(p.schedule)) {
                cachedSchedules[p.plan_id] = p.schedule;
              }
            });
            setLocal(STORAGE_KEYS.SCHEDULES, cachedSchedules);
          }
        });
        return cachedPlans;
      }

      async function savePlan(plan) {
        const now = new Date().toISOString();
        const planId = plan.plan_id || 'plan_' + Math.random().toString(36).substring(2, 11);
        const existing = cachedPlans.find(p => p.plan_id === planId);

        const normPlan = {
          ...existing,
          ...plan,
          plan_id: planId,
          date: normalizeDate(plan.date) || normalizeDate(existing?.date) || '',
          start_time: plan.start_time || existing?.start_time || '11:00',
          last_modified_by: currentUser || '彼氏',
          last_modified_at: now,
          schedule: cachedSchedules[planId] || existing?.schedule || []
        };
        const idx = cachedPlans.findIndex(p => p.plan_id === planId);
        if (idx >= 0) cachedPlans[idx] = normPlan;
        else cachedPlans.unshift(normPlan);
        setLocal(STORAGE_KEYS.PLANS, cachedPlans);
        callGas('savePlan', 'POST', normPlan);
        return normPlan;
      }

      async function deletePlan(planId) {
        cachedPlans = cachedPlans.filter(p => p.plan_id !== planId);
        delete cachedSchedules[planId];
        setLocal(STORAGE_KEYS.PLANS, cachedPlans);
        setLocal(STORAGE_KEYS.SCHEDULES, cachedSchedules);
        callGas('deletePlan', 'POST', { plan_id: planId });
      }

      async function fetchSchedule(planId) {
        return cachedSchedules[planId] || [];
      }

      async function saveSchedule(planId, spots, startTime = '11:00') {
        const now = new Date().toISOString();
        const timed = recalculateScheduleTimes(spots, startTime).map(s => ({
          ...s,
          last_modified_by: currentUser || '彼氏',
          last_modified_at: now
        }));
        cachedSchedules[planId] = timed;
        setLocal(STORAGE_KEYS.SCHEDULES, cachedSchedules);

        const p = cachedPlans.find(p => p.plan_id === planId);
        if (p) {
          p.last_modified_at = now;
          p.last_modified_by = currentUser || '彼氏';
          setLocal(STORAGE_KEYS.PLANS, cachedPlans);
          callGas('savePlan', 'POST', { ...p, schedule: timed });
        }
        return timed;
      }

      async function fetchWishlist() {
        callGas('getWishlist', 'GET').then(res => {
          if (res?.success && Array.isArray(res.wishlist)) {
            cachedWishlist = res.wishlist.map(w => ({
              ...w,
              last_modified_by: w.last_modified_by || '彼氏'
            }));
            setLocal(STORAGE_KEYS.WISHLIST, cachedWishlist);
          }
        });
        return cachedWishlist;
      }

      async function saveWish(wish) {
        const targetName = (wish.spot_name || '').trim().toLowerCase();
        // 重複チェック
        let existing = cachedWishlist.find(w =>
          (wish.wish_id && w.wish_id === wish.wish_id) ||
          (targetName && (w.spot_name || '').trim().toLowerCase() === targetName)
        );

        const wishId = existing?.wish_id || wish.wish_id || 'wish_' + Math.random().toString(36).substring(2, 11);
        const item = {
          ...existing,
          ...wish,
          wish_id: wishId,
          last_modified_by: currentUser || '彼氏',
          updated_at: new Date().toISOString()
        };

        const idx = cachedWishlist.findIndex(w => w.wish_id === wishId);
        if (idx >= 0) cachedWishlist[idx] = item;
        else cachedWishlist.unshift(item);
        setLocal(STORAGE_KEYS.WISHLIST, cachedWishlist);
        callGas('saveWish', 'POST', item);
        return item;
      }

      async function deleteWish(wishId) {
        cachedWishlist = cachedWishlist.filter(w => w.wish_id !== wishId);
        setLocal(STORAGE_KEYS.WISHLIST, cachedWishlist);
        callGas('deleteWish', 'POST', { wish_id: wishId });
      }

      // --- Toast Provider ---
      const ToastContext = createContext();
      function ToastProvider({ children }) {
        const [toasts, setToasts] = useState([]);
        const showToast = useCallback((msg, type = 'success') => {
          const id = Math.random().toString(36).slice(2);
          setToasts(prev => [...prev, { id, msg, type }]);
          setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3000);
        }, []);
        return React.createElement(ToastContext.Provider, { value: { showToast } },
          children,
          React.createElement('div', { className: 'fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none' },
            toasts.map(t => React.createElement('div', {
              key: t.id,
              className: `pointer-events-auto px-4 py-2.5 rounded-xl border shadow-lg text-sm font-medium flex items-center gap-2 bg-white ${
                t.type === 'error' ? 'text-red-600 border-red-200' : 'text-[#2D2A26] border-[#E8E4DE]'
              }`
            },
              t.type === 'error' ? React.createElement(Icons.AlertCircle, { className: 'w-4 h-4 text-red-500' }) : React.createElement(Icons.CheckCircle, { className: 'w-4 h-4 text-emerald-600' }),
              t.msg
            ))
          )
        );
      }
      const useToast = () => useContext(ToastContext);

      // --- 共通コンポーネント ---
      function Header({ currentPath, onNavigate }) {
        const [user, setUser] = useState(currentUser || '彼氏');
        const toggleUser = () => {
          const next = user === '彼氏' ? '彼女' : '彼氏';
          currentUser = next;
          setLocal(STORAGE_KEYS.USER, next);
          setUser(next);
        };
        const navItems = [
          { path: '/', label: 'ホーム' },
          { path: '/plans', label: 'デートプラン' },
          { path: '/wishlist', label: '行きたいリスト' },
          { path: '/history', label: '思い出カレンダー' },
          { path: '/settings', label: '設定' },
        ];
        return React.createElement('header', { className: 'sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-[#E8E4DE]' },
          React.createElement('div', { className: 'max-w-6xl mx-auto px-4 h-16 flex items-center justify-between' },
            React.createElement('div', { className: 'flex items-center gap-6' },
              React.createElement('button', { onClick: () => onNavigate('/'), className: 'text-xl font-bold font-serif text-[#2D2A26] tracking-tight' }, 'デートプラン管理'),
              React.createElement('nav', { className: 'hidden md:flex items-center gap-5 text-sm font-medium text-[#6B6560]' },
                navItems.map(item => React.createElement('button', {
                  key: item.path,
                  onClick: () => onNavigate(item.path),
                  className: `py-1 transition-colors ${currentPath === item.path ? 'text-[#B85C4F] font-bold border-b-2 border-[#B85C4F]' : 'hover:text-[#2D2A26]'}`
                }, item.label))
              )
            ),
            React.createElement('div', { className: 'flex items-center gap-3' },
              React.createElement('button', {
                onClick: toggleUser,
                className: 'flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-[#E8E4DE] bg-[#F5F3EF] text-xs font-semibold hover:bg-slate-200 transition-colors'
              },
                React.createElement(Icons.User, { className: 'w-3.5 h-3.5 text-[#B85C4F]' }),
                React.createElement('span', { className: 'text-[#6B6560]' }, '操作者:'),
                React.createElement('span', { className: 'text-[#B85C4F]' }, user)
              ),
              React.createElement('button', {
                onClick: () => onNavigate('/plan/new'),
                className: 'flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg bg-[#B85C4F] text-white text-xs font-semibold hover:bg-[#9A4D42] shadow-xs transition-colors'
              },
                React.createElement(Icons.Plus, { className: 'w-4 h-4' }),
                '新規プラン'
              )
            )
          )
        );
      }

      function CategoryBadge({ category, showName = true }) {
        const cat = CATEGORY_MAP[category] || CATEGORY_MAP.other;
        return React.createElement('span', {
          className: 'inline-flex items-center gap-1 text-xs px-2 py-0.5 rounded-md font-medium',
          style: { backgroundColor: `${cat.color}15`, color: cat.color }
        },
          React.createElement(Icons[cat.icon] || Icons.MapPin, { className: 'w-3.5 h-3.5' }),
          showName && cat.display_name
        );
      }

      // --- 画面1: トップページ ---
      function TopPage({ onNavigate }) {
        const [plans, setPlans] = useState([]);
        useEffect(() => { fetchPlans().then(setPlans); }, []);

        const nextPlan = plans.find(p => p.status === 'planned') || plans[0];

        return React.createElement('div', { className: 'max-w-5xl mx-auto px-4 py-8 space-y-10' },
          React.createElement('div', { className: 'text-center space-y-3 py-6' },
            React.createElement('h1', { className: 'text-3xl sm:text-4xl font-bold font-serif' }, 'ふたりのデートを、もっとスムーズに。'),
            React.createElement('p', { className: 'text-sm text-[#6B6560]' }, '行きたい場所のストックから自動タイムライン計算、予算集計、スマホしおりまで。')
          ),
          nextPlan && React.createElement('div', { className: 'bg-white rounded-2xl border border-[#E8E4DE] p-6 shadow-xs flex flex-col md:flex-row gap-6 items-start justify-between' },
            React.createElement('div', { className: 'space-y-2.5 flex-1' },
              React.createElement('div', { className: 'flex items-center gap-2 text-xs text-[#B85C4F] font-semibold' },
                React.createElement(Icons.Calendar, { className: 'w-4 h-4' }),
                '次回のデート予定',
                React.createElement('span', { className: 'text-[#6B6560] font-normal ml-2' }, `更新: ${nextPlan.last_modified_by || '彼氏'}`)
              ),
              React.createElement('h2', {
                onClick: () => onNavigate(`/plan/${nextPlan.plan_id}`),
                className: 'text-2xl font-bold font-serif hover:text-[#B85C4F] cursor-pointer'
              }, nextPlan.title),
              React.createElement('div', { className: 'flex flex-wrap gap-3 text-xs text-[#6B6560]' },
                React.createElement('span', { className: 'bg-[#F5F3EF] px-2.5 py-1 rounded font-semibold text-[#2D2A26]' }, `${formatDateDisplay(nextPlan.date)} ${nextPlan.start_time || '11:00'}〜`),
                React.createElement('span', { className: 'flex items-center gap-1' }, React.createElement(Icons.MapPin, { className: 'w-3.5 h-3.5 text-[#B85C4F]' }), `${nextPlan.prefecture || ''} ${nextPlan.area || ''}`),
                nextPlan.budget_limit > 0 && React.createElement('span', null, `予算上限: ${formatYen(nextPlan.budget_limit)}`)
              ),
              nextPlan.description && React.createElement('p', { className: 'text-xs text-[#6B6560] leading-relaxed line-clamp-2' }, nextPlan.description)
            ),
            React.createElement('div', { className: 'flex flex-col sm:flex-row md:flex-col gap-2 shrink-0 w-full md:w-auto' },
              React.createElement('button', {
                onClick: () => onNavigate(`/plan/${nextPlan.plan_id}`),

                if (target.title) setTitle(target.title);

                className: 'bg-white rounded-xl border border-[#E8E4DE] p-4 space-y-2.5 shadow-2xs flex flex-col justify-between'
              },
                React.createElement('div', { className: 'space-y-1.5' },
                  React.createElement('div', { className: 'flex items-center justify-between text-xs' },
                    React.createElement(CategoryBadge, { category: w.category }),
                    w.tag && React.createElement('span', { className: 'text-[10px] bg-[#F5F3EF] px-2 py-0.5 rounded text-[#6B6560]' }, w.tag)
                  ),
                  React.createElement('h3', { className: 'font-bold text-sm text-[#2D2A26]' }, w.spot_name),
                  w.address && React.createElement('p', { className: 'text-[11px] text-[#6B6560] truncate' }, w.address),
                  w.memo && React.createElement('p', { className: 'text-xs text-[#6B6560] bg-[#F5F3EF] p-2 rounded' }, w.memo)
                ),
                React.createElement('div', { className: 'flex items-center justify-between pt-2 border-t border-[#E8E4DE] text-xs' },
                  React.createElement('span', { className: 'font-semibold' }, formatYen(w.estimated_budget_for_two)),
                  React.createElement('button', {
                    onClick: () => handleDeleteWish(w.wish_id),
                    className: 'text-red-500 hover:text-red-700 text-xs'
                  }, '削除')
                )
              ))
            )
          ) : (
            // プラン登録済みスポット表示
            filteredPlanSpots.length === 0 ? React.createElement('p', { className: 'text-xs text-[#6B6560] py-12 text-center' }, 'プランに登録されたスポットはありません') :
            React.createElement('div', { className: 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4' },
              filteredPlanSpots.map((s, idx) => React.createElement('div', {
                key: `${s.schedule_id}_${idx}`,
                className: 'bg-white rounded-xl border-l-4 border-l-[#5A8F7B] border-[#E8E4DE] p-4 space-y-2 shadow-2xs'
              },
                React.createElement('div', { className: 'flex items-center justify-between text-xs' },
                  React.createElement(CategoryBadge, { category: s.category }),
                  React.createElement('span', { className: 'text-[11px] text-[#5A8F7B] font-semibold' }, formatDateDisplay(s.planDate))
                ),
                React.createElement('h3', { className: 'font-bold text-sm text-[#2D2A26]' }, s.spot_name),
                React.createElement('div', { className: 'text-[11px] text-[#6B6560]' }, `採用プラン: ${s.planTitle}`),
                s.address && React.createElement('p', { className: 'text-[11px] text-[#6B6560] truncate' }, s.address),
                React.createElement('div', { className: 'flex items-center justify-between pt-2 border-t border-[#E8E4DE] text-xs' },
                  React.createElement('span', null, `予算: ${formatYen(s.budget_for_two)}`),
                  React.createElement('button', {
                    onClick: () => onNavigate(`/plan/${s.planId}`),
                    className: 'text-[#B85C4F] font-semibold hover:underline'
                  }, 'しおりを見る →')
                )
              ))
            )
          ),

          // 追加モーダル
          showAddModal && React.createElement('div', { className: 'fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4' },
            React.createElement('form', { onSubmit: handleSaveWish, className: 'bg-white rounded-2xl max-w-md w-full p-6 space-y-4 text-xs' },
              React.createElement('h3', { className: 'text-base font-bold font-serif' }, '行きたい場所を追加'),
              React.createElement('div', null,
                React.createElement('label', { className: 'block font-semibold mb-1' }, 'スポット名 *'),
                React.createElement('input', {
                  type: 'text',
                  required: true,
                  value: spotName,
                  onChange: e => setSpotName(e.target.value),
                  placeholder: '例: カフェキツネ 青山',
                  className: 'w-full px-3 py-2 border rounded-lg outline-none'
                })
              ),
              React.createElement('div', { className: 'grid grid-cols-2 gap-2' },
                React.createElement('div', null,
                  React.createElement('label', { className: 'block font-semibold mb-1' }, 'カテゴリ'),
                  React.createElement('select', {
                    value: category,
                    onChange: e => setCategory(e.target.value),
                    className: 'w-full px-3 py-2 border rounded-lg bg-white outline-none'
                  }, CATEGORIES.map(c => React.createElement('option', { key: c.category_id, value: c.category_id }, c.display_name)))
                ),
                React.createElement('div', null,
                  React.createElement('label', { className: 'block font-semibold mb-1' }, '予算目安（2人分）'),
                  React.createElement('input', {
                    type: 'number',
                    step: 100,
                    value: budget,
                    onChange: e => setBudget(e.target.value),
                    className: 'w-full px-3 py-2 border rounded-lg outline-none'
                  })
                )
              ),
              React.createElement('div', null,
                React.createElement('label', { className: 'block font-semibold mb-1' }, '住所・最寄り駅'),
                React.createElement('input', {
                  type: 'text',
                  value: address,
                  onChange: e => setAddress(e.target.value),
                  placeholder: '例: 東京都港区南青山...',
                  className: 'w-full px-3 py-2 border rounded-lg outline-none'
                })
              ),
              React.createElement('div', null,
                React.createElement('label', { className: 'block font-semibold mb-1' }, 'タグ'),
                React.createElement('input', {
                  type: 'text',
                  value: tag,
                  onChange: e => setTag(e.target.value),
                  className: 'w-full px-3 py-2 border rounded-lg outline-none'
                })
              ),
              React.createElement('div', { className: 'flex justify-end gap-2 pt-2' },
                React.createElement('button', {
                  type: 'button',
                  onClick: () => setShowAddModal(false),
                  className: 'px-4 py-2 border rounded-lg'
                }, 'キャンセル'),
                React.createElement('button', {
                  type: 'submit',
                  className: 'px-5 py-2 bg-[#B85C4F] text-white rounded-lg font-semibold'
                }, '保存する')
              )
            )
          )
        );
      }

      // --- 画面6: 当日のしおり閲覧 ---
      function PlanViewPage({ planId, onNavigate }) {
        const [plan, setPlan] = useState(null);
        const [spots, setSpots] = useState([]);
        const { showToast } = useToast();

        useEffect(() => {
          fetchPlans().then(list => setPlan(list.find(p => p.plan_id === planId)));
          fetchSchedule(planId).then(setSpots);
        }, [planId]);

        if (!plan) return React.createElement('div', { className: 'py-20 text-center text-xs' }, '読み込み中...');

        const totalBudget = spots.reduce((acc, s) => acc + (s.budget_for_two || 0), 0);

        return React.createElement('div', { className: 'max-w-2xl mx-auto px-4 py-8 space-y-6 print-page' },
          React.createElement('div', { className: 'flex items-center justify-between no-print' },
            React.createElement('button', {
              onClick: () => onNavigate('/plans'),
              className: 'text-xs text-[#6B6560] hover:text-[#2D2A26]'
            }, '← プラン一覧に戻る'),
            React.createElement('div', { className: 'flex gap-2' },
              React.createElement('button', {
                onClick: () => window.print(),
                className: 'px-3 py-1.5 border border-[#E8E4DE] bg-white rounded-lg text-xs font-medium'
              }, '印刷 / PDF'),
              React.createElement('button', {
                onClick: () => onNavigate(`/plan/${planId}/spots`),
                className: 'px-3 py-1.5 bg-[#B85C4F] text-white rounded-lg text-xs font-semibold'
              }, 'スポット編集')
            )
          ),

          React.createElement('div', { className: 'bg-white rounded-2xl border border-[#E8E4DE] p-6 space-y-3 shadow-xs' },
            React.createElement('div', { className: 'flex items-center gap-2 text-xs' },
              React.createElement('span', { className: 'font-bold text-[#B85C4F] bg-[#B85C4F]/10 px-2.5 py-1 rounded' }, formatDateDisplay(plan.date)),
              React.createElement('span', { className: 'text-[#6B6560]' }, `${plan.start_time || '11:00'}〜 スタート`),
              React.createElement('span', { className: 'text-[#6B6560]' }, `(${plan.prefecture || ''} ${plan.area || ''})`)
            ),
            React.createElement('h1', { className: 'text-2xl font-bold font-serif' }, plan.title),
            plan.description && React.createElement('p', { className: 'text-xs text-[#6B6560] leading-relaxed' }, plan.description),
            React.createElement('div', { className: 'pt-3 border-t border-[#E8E4DE] flex justify-between text-xs text-[#6B6560]' },
              React.createElement('span', null, `2人合計予算: ${formatYen(totalBudget)}`),
              React.createElement('span', null, `最終更新: ${plan.last_modified_by || '彼氏'}`)
            )
          ),

          // タイムライン
          React.createElement('div', { className: 'space-y-4' },
            React.createElement('h2', { className: 'text-base font-bold font-serif' }, `当日のスケジュール (${spots.length}ヶ所)`),
            spots.map((s, idx) => {
              const endTime = addMinutesToTime(s.start_time, s.duration_min);
              return React.createElement('div', { key: s.schedule_id, className: 'space-y-2' },
                React.createElement('div', { className: 'bg-white rounded-xl border border-[#E8E4DE] p-4 space-y-2 shadow-2xs' },
                  React.createElement('div', { className: 'flex items-center justify-between text-xs' },
                    React.createElement('span', { className: 'font-bold text-[#B85C4F]' }, `${s.start_time} 〜 ${endTime}`),
                    React.createElement(CategoryBadge, { category: s.category })
                  ),
                  React.createElement('h3', { className: 'text-base font-bold text-[#2D2A26]' }, s.spot_name),
                  s.address && React.createElement('p', { className: 'text-xs text-[#6B6560]' }, `📍 ${s.address}`),
                  s.memo && React.createElement('p', { className: 'text-xs text-[#6B6560] bg-[#F5F3EF] p-2.5 rounded-lg' }, s.memo),
                  React.createElement('div', { className: 'flex justify-between items-center pt-2 border-t border-[#E8E4DE] text-xs text-[#6B6560]' },
                    React.createElement('span', null, `滞在: ${s.duration_min}分`),
                    React.createElement('span', { className: 'font-semibold text-[#2D2A26]' }, `予算: ${formatYen(s.budget_for_two)}`)
                  )
                ),
                idx < spots.length - 1 && React.createElement('div', { className: 'pl-6 text-xs text-[#6B6560] flex items-center gap-2' },
                  React.createElement('span', { className: 'w-0.5 h-4 bg-[#E8E4DE]' }),
                  React.createElement('span', { className: 'text-[11px] bg-[#F5F3EF] px-2 py-0.5 rounded' }, `移動 約${s.transit_min || 15}分`)
                )
              );
            })
          )
        );
      }

      // --- 画面7: 思い出カレンダー ---
      function HistoryPage({ onNavigate }) {
        const [plans, setPlans] = useState([]);
        useEffect(() => { fetchPlans().then(setPlans); }, []);

        return React.createElement('div', { className: 'max-w-4xl mx-auto px-4 py-8 space-y-6' },
          React.createElement('h1', { className: 'text-2xl font-bold font-serif' }, '思い出カレンダー & デート履歴'),
          React.createElement('div', { className: 'space-y-3' },
            plans.map(p => React.createElement('div', {
              key: p.plan_id,
              onClick: () => onNavigate(`/plan/${p.plan_id}`),
              className: 'bg-white rounded-xl border border-[#E8E4DE] p-4 flex items-center justify-between hover:border-[#B85C4F]/50 cursor-pointer shadow-2xs'
            },
              React.createElement('div', null,
                React.createElement('div', { className: 'text-xs font-bold text-[#B85C4F]' }, formatDateDisplay(p.date)),
                React.createElement('h3', { className: 'font-bold text-base mt-0.5' }, p.title),
                React.createElement('p', { className: 'text-xs text-[#6B6560]' }, `${p.prefecture || ''} ${p.area || ''}`)
              ),
              React.createElement('span', { className: 'text-xs text-[#B85C4F] font-semibold' }, 'しおりを見る →')
            ))
          )
        );
      }

      // --- 画面8: 設定画面 ---
      function SettingsPage() {
        const { showToast } = useToast();
        const [user, setUser] = useState(currentUser || '彼氏');

        const handleUserChange = (u) => {
          currentUser = u;
          setLocal(STORAGE_KEYS.USER, u);
          setUser(u);
          showToast(`操作者を「${u}」に変更しました`);
        };

        return React.createElement('div', { className: 'max-w-xl mx-auto px-4 py-8 space-y-6' },
          React.createElement('h1', { className: 'text-2xl font-bold font-serif' }, '設定・ユーザー切替'),
          React.createElement('div', { className: 'bg-white rounded-2xl border border-[#E8E4DE] p-6 space-y-4 text-xs shadow-xs' },
            React.createElement('h2', { className: 'text-sm font-bold font-serif' }, '現在の操作者'),
            React.createElement('p', { className: 'text-[#6B6560]' }, '編集時やチェックリスト更新時の記録名として使用されます。'),
            React.createElement('div', { className: 'flex gap-3' },
              ['彼氏', '彼女'].map(u => React.createElement('button', {
                key: u,
                onClick: () => handleUserChange(u),
                className: `flex-1 py-3 rounded-xl border font-bold text-sm transition-all ${user === u ? 'bg-[#B85C4F] text-white border-[#B85C4F]' : 'bg-[#F5F3EF] border-[#E8E4DE] text-[#6B6560]'}`
              }, u))
            )
          ),
          React.createElement('div', { className: 'bg-white rounded-2xl border border-[#E8E4DE] p-6 space-y-3 text-xs shadow-xs text-[#6B6560]' },
            React.createElement('h2', { className: 'text-sm font-bold font-serif text-[#2D2A26]' }, 'Googleスプレッドシート連携'),
            React.createElement('p', null, 'GASエンドポイント経由で自動保存・取得されます。'),
            React.createElement('div', { className: 'p-3 bg-[#F5F3EF] rounded-lg font-mono text-[11px] break-all' }, CONFIG.gasUrl)
          )
        );
      }

      // --- メインルーティング ---
      function App() {
        const [path, setPath] = useState(() => window.location.hash.replace('#', '') || '/');

        useEffect(() => {
          const onHash = () => setPath(window.location.hash.replace('#', '') || '/');
          window.addEventListener('hashchange', onHash);
          return () => window.removeEventListener('hashchange', onHash);
        }, []);

        const navigate = (p) => {
          window.location.hash = p;
          setPath(p);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        const renderPage = () => {
          if (path === '/' || path === '') return React.createElement(TopPage, { onNavigate: navigate });
          if (path === '/plans') return React.createElement(PlanListPage, { onNavigate: navigate });
          if (path === '/plan/new') return React.createElement(PlanFormPage, { onNavigate: navigate });
          if (path === '/wishlist') return React.createElement(WishlistPage, { onNavigate: navigate });
          if (path === '/history') return React.createElement(HistoryPage, { onNavigate: navigate });
          if (path === '/settings') return React.createElement(SettingsPage, { onNavigate: navigate });

          const editMatch = path.match(/^\/plan\/([^/]+)\/edit$/);
          if (editMatch) return React.createElement(PlanFormPage, { planId: editMatch[1], onNavigate: navigate });

          const spotMatch = path.match(/^\/plan\/([^/]+)\/spots$/);
          if (spotMatch) return React.createElement(SpotRegisterPage, { planId: spotMatch[1], onNavigate: navigate });

          const viewMatch = path.match(/^\/plan\/([^/]+)$/);
          if (viewMatch) return React.createElement(PlanViewPage, { planId: viewMatch[1], onNavigate: navigate });

          return React.createElement(TopPage, { onNavigate: navigate });
        };

        return React.createElement(ToastProvider, null,
          React.createElement('div', { className: 'min-h-screen flex flex-col' },
            React.createElement(Header, { currentPath: path, onNavigate: navigate }),
            React.createElement('main', { className: 'flex-1 pb-16' }, renderPage())
          )
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
    </script>
  </body>
</html>
