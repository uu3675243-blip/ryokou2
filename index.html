    // --- 日付・時刻の正規化ユーティリティ（不具合1&4対策） ---
    function normalizeDateStr(val) {
      if (!val) return '';
      if (val instanceof Date) {
        if (isNaN(val.getTime())) return '';
        const y = val.getFullYear();
        const m = String(val.getMonth() + 1).padStart(2, '0');
        const d = String(val.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
      }
      const str = String(val).trim();
      const m = str.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
      if (m) {
        return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
      }
      const dObj = new Date(str);
      if (!isNaN(dObj.getTime())) {
        const y = dObj.getFullYear();
        const mo = String(dObj.getMonth() + 1).padStart(2, '0');
        const da = String(dObj.getDate()).padStart(2, '0');
        return `${y}-${mo}-${da}`;
      }
      return str;
    }

    function normalizeTimeStr(val) {
      if (!val) return '11:00';
      const str = String(val).trim();
      const m = str.match(/(\d{1,2}):(\d{2})/);
      if (m) {
        return `${m[1].padStart(2, '0')}:${m[2]}`;
      }
      return '11:00';
    }

    function addMinutesToTime(timeStr, minutes) {
      const norm = normalizeTimeStr(timeStr);
      const [h, m] = norm.split(':').map(v => parseInt(v, 10) || 0);
      const total = h * 60 + m + (minutes || 0);
      const newH = Math.floor(total / 60) % 24;
      const newM = total % 60;
      return `${String(newH).padStart(2, '0')}:${String(newM).padStart(2, '0')}`;
    }

    function recalculateSchedule(spots, startTime = '11:00') {
      let current = normalizeTimeStr(startTime);
      return spots.map((spot, idx) => {
        const item = {
          ...spot,
          spot_order: idx + 1,
          start_time: current
        };
        const dur = Number(spot.duration_min) || 60;
        const trans = Number(spot.transit_min) !== undefined ? Number(spot.transit_min) : 15;
        current = addMinutesToTime(current, dur + trans);
        return item;
      });
    }

    function formatDateJP(dateStr) {
      const norm = normalizeDateStr(dateStr);
      if (!norm) return '';
      try {
        const [y, m, d] = norm.split('-').map(Number);
        const dt = new Date(y, m - 1, d);
        const days = ['日', '月', '火', '水', '木', '金', '土'];
        return `${m}月${d}日(${days[dt.getDay()]})`;
      } catch (e) {
        return norm;
      }
    }

    function formatTimeAgo(isoStr) {
      if (!isoStr) return '';
      try {
        const diff = Date.now() - new Date(isoStr).getTime();
        const sec = Math.floor(diff / 1000);
        const min = Math.floor(sec / 60);
        const hr = Math.floor(min / 60);
        const day = Math.floor(hr / 24);
        if (min < 1) return 'たった今';
        if (min < 60) return `${min}分前`;
        if (hr < 24) return `${hr}時間前`;
        if (day === 1) return '昨日';
        if (day < 7) return `${day}日前`;
        const d = new Date(isoStr);
        return `${d.getMonth() + 1}/${d.getDate()}`;
      } catch (e) {
        return '';
      }
    }

    function generateId(prefix) {
      const randomStr = Math.random().toString(36).substring(2, 10);
      return `${prefix}_${Date.now().toString(36)}_${randomStr}`;
    }

    function formatYen(num) {
      return '¥' + (Number(num) || 0).toLocaleString('ja-JP');
    }

    function calculateBudget(val, mode) {
      const num = Math.max(0, parseInt(val, 10) || 0);
      return mode === 'per_person'
        ? { budget_per_person: num, budget_for_two: num * 2 }
        : { budget_per_person: Math.round(num / 2), budget_for_two: num };
    }

    function calculateTotalBudget(spots, mode = 'for_two') {
      return (spots || []).reduce((sum, s) => {
        return sum + (mode === 'for_two' ? (Number(s.budget_for_two) || 0) : (Number(s.budget_per_person) || 0));
      }, 0);
    }

    async function compressImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width;
            let h = img.height;
            const max = 640;
            if (w > h && w > max) {
              h = Math.round((h * max) / w);
              w = max;
            } else if (h > max) {
              w = Math.round((w * max) / h);
              h = max;
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            if (ctx) {
              ctx.drawImage(img, 0, 0, w, h);
              resolve(canvas.toDataURL('image/jpeg', 0.72));
            } else {
              resolve(e.target.result);
            }
          };
          img.onerror = () => resolve(e.target.result);
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // --- ストレージ＆データアクセス層 ---
    const STORAGE_KEYS = {

    function readStorage(key, defaultVal) {
      try {
        const item = localStorage.getItem(key);
        if (item) return JSON.parse(item);
      } catch (e) {}
      return defaultVal;
    }

    function writeStorage(key, val) {
      try {
        localStorage.setItem(key, JSON.stringify(val));
      } catch (e) {}
    }

    let cachePlans = readStorage(STORAGE_KEYS.PLANS, INITIAL_PLANS);
    let cacheSchedules = readStorage(STORAGE_KEYS.SCHEDULES, INITIAL_SCHEDULES);
    let cacheWishlist = readStorage(STORAGE_KEYS.WISHLIST, INITIAL_WISHLIST);
    let cacheChecklists = readStorage(STORAGE_KEYS.CHECKLISTS, {});
    let currentUser = readStorage(STORAGE_KEYS.USER, '彼氏'); // 修正3: デフォルト「彼氏」

    function getCurrentUser() {
      return currentUser;

    function setCurrentUser(user) {
      currentUser = (user === '彼女') ? '彼女' : '彼氏';
      writeStorage(STORAGE_KEYS.USER, currentUser);

    // --- 通信層 (JSONP / Fetch) ---
    function sendJsonp(url, params) {
      return new Promise((resolve) => {
        const cbName = 'gas_cb_' + Math.random().toString(36).substring(2, 9) + '_' + Date.now();
        const searchParams = new URLSearchParams({ ...params, callback: cbName });
        const scriptUrl = url.includes('?') ? `${url}&${searchParams}` : `${url}?${searchParams}`;
        
        let timer = setTimeout(() => {
          cleanup();
          resolve({ success: false, error: 'JSONP timeout' });
        }, 8000);

        function cleanup() {
          if (timer) clearTimeout(timer);
          try { delete window[cbName]; } catch (e) {}
          const el = document.getElementById(cbName);
          if (el && el.parentNode) el.parentNode.removeChild(el);
        }

        window[cbName] = (res) => {
          cleanup();
          resolve({ success: true, data: res });
        };

        const script = document.createElement('script');
        script.id = cbName;
        script.src = scriptUrl;
        script.onerror = () => {
          cleanup();
          resolve({ success: false, error: 'Script load error' });
        };
        document.head.appendChild(script);
      });
    }

    async function apiRequest(action, method = 'GET', payload = {}) {
      if (!CONFIG.gasUrl || CONFIG.gasUrl.includes('YOUR_GAS_ID')) {
        return { success: false, error: 'NO_GAS_URL' };
      }
      const gasUrl = CONFIG.gasUrl.trim();

      if (method === 'GET') {
        try {
          const url = `${gasUrl}?action=${action}&${new URLSearchParams(payload)}`;
          const ctrl = new AbortController();
          const t = setTimeout(() => ctrl.abort(), 3500);
          const res = await fetch(url, { headers: { Accept: 'application/json' }, signal: ctrl.signal });
          clearTimeout(t);
          if (res.ok) {
            const data = await res.json();
            if (data.success !== false) return { success: true, data };
          }
        } catch (e) {}
        return await sendJsonp(gasUrl, { action, ...payload });
      }

      // POST
      const bodyData = { action, ...payload };
      try {
        const ctrl = new AbortController();
        const t = setTimeout(() => ctrl.abort(), 4000);
        const res = await fetch(gasUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(bodyData),
          signal: ctrl.signal
        });
        clearTimeout(t);
        if (res.ok) {
          const data = await res.json();
          if (data.success !== false) return { success: true, data };
        }
      } catch (e) {}

      // Fallback via Base64 JSONP
      try {
        const b64 = btoa(encodeURIComponent(JSON.stringify(bodyData)).replace(/%([0-9A-F]{2})/g, (_, p1) => String.fromCharCode(parseInt(p1, 16))));
        return await sendJsonp(gasUrl, { b64 });
      } catch (e) {
        return { success: false, error: e.message };
      }
    }

    // --- データCRUD操作 ---
    async function getPlans() {
      // GAS側から最新取得を試行
      apiRequest('getPlans', 'GET').then(res => {
        if (res.success && res.data && Array.isArray(res.data.plans)) {
          cachePlans = res.data.plans.map(p => ({
            ...p,
            date: normalizeDateStr(p.date),
            start_time: normalizeTimeStr(p.start_time)
          }));
          writeStorage(STORAGE_KEYS.PLANS, cachePlans);
          res.data.plans.forEach(p => {
            if (p.schedule) cacheSchedules[p.plan_id] = p.schedule;
            if (p.checklist) cacheChecklists[p.plan_id] = p.checklist;
          });
          writeStorage(STORAGE_KEYS.SCHEDULES, cacheSchedules);
          writeStorage(STORAGE_KEYS.CHECKLISTS, cacheChecklists);
        }
      });
      return cachePlans;
    }

    async function getPlan(planId) {
      let plan = cachePlans.find(p => p.plan_id === planId);
      if (plan) {
        plan.date = normalizeDateStr(plan.date);
        plan.start_time = normalizeTimeStr(plan.start_time);
        return plan;
      }
      const res = await apiRequest('getPlan', 'GET', { planId });
      if (res.success && res.data && res.data.plan) {
        const p = res.data.plan;
        p.date = normalizeDateStr(p.date);
        p.start_time = normalizeTimeStr(p.start_time);
        cachePlans.push(p);
        writeStorage(STORAGE_KEYS.PLANS, cachePlans);
        if (p.schedule) {
          cacheSchedules[planId] = p.schedule;
          writeStorage(STORAGE_KEYS.SCHEDULES, cacheSchedules);
        }
        return p;
      }
      return null;
    }

    async function savePlan(planData) {
      const now = new Date().toISOString();
      const planId = planData.plan_id || generateId('plan');
      const normalized = {
        ...planData,
        plan_id: planId,
        date: normalizeDateStr(planData.date),
        start_time: normalizeTimeStr(planData.start_time),
        last_modified_at: now,
        last_modified_by: getCurrentUser(),
        created_at: planData.created_at || now,
        updated_at: now
      };

      const idx = cachePlans.findIndex(p => p.plan_id === planId);
      if (idx >= 0) {
        cachePlans[idx] = normalized;
      } else {
        cachePlans.unshift(normalized);
      }
      writeStorage(STORAGE_KEYS.PLANS, cachePlans);

      apiRequest('savePlan', 'POST', {
        ...normalized,
        schedule: cacheSchedules[planId] || [],
        checklist: cacheChecklists[planId] || []
      });

      return { success: true, data: normalized };
    }

    async function updatePlan(planData, expectedModifiedAt) {
      const now = new Date().toISOString();
      const idx = cachePlans.findIndex(p => p.plan_id === planData.plan_id);
      
      // 楽観的排他制御チェック
      if (idx >= 0 && expectedModifiedAt && cachePlans[idx].last_modified_at && cachePlans[idx].last_modified_at !== expectedModifiedAt) {
        return { success: false, isConflict: true, currentData: cachePlans[idx], error: '他の方がプランを更新しました' };
      }

      const normalized = {
        ...planData,
        date: normalizeDateStr(planData.date),
        start_time: normalizeTimeStr(planData.start_time),
        last_modified_at: now,
        last_modified_by: getCurrentUser(),
        updated_at: now
      };

      if (idx >= 0) cachePlans[idx] = normalized;
      else cachePlans.push(normalized);
      writeStorage(STORAGE_KEYS.PLANS, cachePlans);

      apiRequest('updatePlan', 'POST', {
        ...normalized,
        schedule: cacheSchedules[planData.plan_id] || [],
        checklist: cacheChecklists[planData.plan_id] || []
      });

      return { success: true, data: normalized };
    }

    async function deletePlan(planId) {
      cachePlans = cachePlans.filter(p => p.plan_id !== planId);
      delete cacheSchedules[planId];
      delete cacheChecklists[planId];
      writeStorage(STORAGE_KEYS.PLANS, cachePlans);
      writeStorage(STORAGE_KEYS.SCHEDULES, cacheSchedules);
      writeStorage(STORAGE_KEYS.CHECKLISTS, cacheChecklists);
      apiRequest('deletePlan', 'POST', { plan_id: planId });
      return true;
    }

    async function getSchedule(planId) {
      if (cacheSchedules[planId]) return cacheSchedules[planId];
      const res = await apiRequest('getSchedule', 'GET', { planId });
      if (res.success && res.data && res.data.schedule) {
        cacheSchedules[planId] = res.data.schedule;
        writeStorage(STORAGE_KEYS.SCHEDULES, cacheSchedules);
        return res.data.schedule;
      }
      return [];
    }

    // 修正要件2 & 5: スポット保存時、行きたいリスト(Wishlist)へ重複なく自動追加・同期する処理
    async function syncSpotToWishlist(spot, plan) {
      if (!spot || !spot.spot_name) return;
      const spotNameTrimmed = spot.spot_name.trim();
      const wishlist = await getWishlist();
      
      const existing = wishlist.find(w => w.spot_name && w.spot_name.trim().toLowerCase() === spotNameTrimmed.toLowerCase());
      const now = new Date().toISOString();

      if (existing) {
        // 既に存在する場合はプラン登録情報を更新
        const updated = {
          ...existing,
          spot_name: spotNameTrimmed,
          category: spot.category || existing.category,
          address: spot.address || existing.address,
          lat: spot.lat !== undefined ? spot.lat : existing.lat,
          lng: spot.lng !== undefined ? spot.lng : existing.lng,
          image_url: spot.image_url || existing.image_url,
          url: spot.url || existing.url,
          in_plan: true,
          plan_id: plan.plan_id,
          plan_title: plan.title,
          plan_date: plan.date,
          updated_at: now
        };
        await saveWish(updated);
      } else {
        // 未登録の場合は行きたいリストに新規追加（プラン登録済み属性を付加）
        const newWish = {
          wish_id: generateId('wish'),
          spot_name: spotNameTrimmed,
          category: spot.category || 'cafe',
          address: spot.address || '',
          lat: spot.lat || null,
          lng: spot.lng || null,
          estimated_budget_per_person: spot.budget_per_person || 0,
          estimated_budget_for_two: spot.budget_for_two || 0,
          budget_input_type: spot.budget_input_type || 'per_person',
          memo: spot.memo || '',
          image_url: spot.image_url || '',
          url: spot.url || '',
          tag: 'プラン登録済み',
          in_plan: true,
          plan_id: plan.plan_id,
          plan_title: plan.title,
          plan_date: plan.date,
          last_modified_by: getCurrentUser(),
          created_at: now,
          updated_at: now
        };
        await saveWish(newWish);
      }
    }

    async function saveSchedule(planId, spots, startTime = '11:00') {
      const now = new Date().toISOString();
      const user = getCurrentUser();
      const recalculated = recalculateSchedule(spots, startTime).map(s => ({
        ...s,
        last_modified_at: now,
        last_modified_by: user
      }));

      cacheSchedules[planId] = recalculated;
      writeStorage(STORAGE_KEYS.SCHEDULES, cacheSchedules);

      const planIdx = cachePlans.findIndex(p => p.plan_id === planId);
      if (planIdx >= 0) {
        cachePlans[planIdx].last_modified_at = now;
        cachePlans[planIdx].last_modified_by = user;
        writeStorage(STORAGE_KEYS.PLANS, cachePlans);

        // 連動同期を実行
        recalculated.forEach(spot => {
          syncSpotToWishlist(spot, cachePlans[planIdx]);
        });

        apiRequest('savePlan', 'POST', {
          ...cachePlans[planIdx],
          schedule: recalculated,
          checklist: cacheChecklists[planId] || []
        });
      }

      return { success: true, data: recalculated };
    }

    async function addSpot(planId, spotData, startTime = '11:00') {
      const current = cacheSchedules[planId] || [];
      const newSpot = {
        ...spotData,
        schedule_id: generateId('sch'),
        plan_id: planId,
        spot_order: current.length + 1,
        created_at: new Date().toISOString(),
        last_modified_at: new Date().toISOString(),
        last_modified_by: getCurrentUser()
      };
      const updated = [...current, newSpot];
      const res = await saveSchedule(planId, updated, startTime);
      return res.data;
    }

    async function deleteSpot(planId, scheduleId, startTime = '11:00') {
      const current = cacheSchedules[planId] || [];
      const updated = current.filter(s => s.schedule_id !== scheduleId);
      const res = await saveSchedule(planId, updated, startTime);
      return res.data;
    }

    async function saveWish(wishData) {
      const now = new Date().toISOString();
      const wishId = wishData.wish_id || generateId('wish');
      const item = {
        ...wishData,
        wish_id: wishId,
        last_modified_at: now,
        last_modified_by: wishData.last_modified_by || getCurrentUser(),
        created_at: wishData.created_at || now
      };
      const idx = cacheWishlist.findIndex(w => w.wish_id === wishId);
      if (idx >= 0) cacheWishlist[idx] = item;
      else cacheWishlist.unshift(item);
      writeStorage(STORAGE_KEYS.WISHLIST, cacheWishlist);
      apiRequest('saveWish', 'POST', item);
      return { success: true, data: item };

    async function saveChecklist(planId, list) {
      cacheChecklists[planId] = list;
      writeStorage(STORAGE_KEYS.CHECKLISTS, cacheChecklists);
      const plan = cachePlans.find(p => p.plan_id === planId);
      if (plan) {
        apiRequest('savePlan', 'POST', {
          ...plan,
          schedule: cacheSchedules[planId] || [],
          checklist: list
        });
      }
      return list;
    }

    async function toggleChecklistItem(planId, itemId, isChecked) {
      const list = cacheChecklists[planId] || createDefaultChecklist(planId);
      const updated = list.map(item => item.id === itemId ? { ...item, is_checked: isChecked, last_modified_by: getCurrentUser() } : item);
      return await saveChecklist(planId, updated);

      const list = cacheChecklists[planId] || createDefaultChecklist(planId);
      const newItem = {
        id: generateId('chk'),
        plan_id: planId,
        title: data.title,
        assignee: data.assignee || getCurrentUser(),
        category: data.category || 'essential',
        is_checked: false,
        memo: data.memo || '',
        created_at: new Date().toISOString(),
        last_modified_by: getCurrentUser()
      };
      return await saveChecklist(planId, [...list, newItem]);
    }

    async function deleteChecklistItem(planId, itemId) {
      const list = (cacheChecklists[planId] || []).filter(item => item.id !== itemId);
      return await saveChecklist(planId, list);

    async function addPresetsToChecklist(planId, presets) {
      const list = cacheChecklists[planId] || createDefaultChecklist(planId);
      const existingTitles = new Set(list.map(i => i.title));
      const now = new Date().toISOString();
      const toAdd = presets.filter(p => !existingTitles.has(p.title)).map(p => ({
        id: generateId('chk'),
        plan_id: planId,
        title: p.title,
        assignee: p.assignee || getCurrentUser(),
        category: p.category,
        is_checked: false,
        memo: p.memo || '',
        created_at: now,
        last_modified_by: getCurrentUser()
      }));
      return await saveChecklist(planId, [...list, ...toAdd]);
    }

    async function resetChecklist(planId) {
      const list = (cacheChecklists[planId] || []).map(i => ({ ...i, is_checked: false }));
      return await saveChecklist(planId, list);
    }

    // --- Toast通知 Context ---
    const ToastContext = createContext(null);
    function ToastProvider({ children }) {
      const [toasts, setToasts] = useState([]);
      const showToast = useCallback((msg, type = 'success') => {
        const id = Math.random().toString(36).substring(2, 9);
        setToasts(prev => [...prev, { id, msg, type }]);
        setTimeout(() => {
          setToasts(prev => prev.filter(t => t.id !== id));
        }, 3500);
      }, []);
      const removeToast = (id) => setToasts(prev => prev.filter(t => t.id !== id));

      return (
        <ToastContext.Provider value={{ showToast }}>
          {children}
          <div className="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none max-w-sm w-full px-4 sm:px-0">
            {toasts.map(t => (
              <div key={t.id} className={`pointer-events-auto flex items-center justify-between gap-3 p-3.5 rounded-xl border shadow-lg transition-all animate-in fade-in duration-200 ${
                t.type === 'error' ? 'bg-white border-[#C44D3D]/30 text-[#C44D3D]' :
                t.type === 'info' ? 'bg-white border-[#5A7D8C]/30 text-[#2D2A26]' :
                'bg-white border-[#5A8F7B]/30 text-[#2D2A26]'
              }`}>
                <span className="text-sm font-medium leading-snug">{t.msg}</span>
                <button onClick={() => removeToast(t.id)} className="text-[#6B6560] hover:text-[#2D2A26] p-1 text-xs">✕</button>
              </div>
            ))}
          </div>
        </ToastContext.Provider>
      );
    }
    const useToast = () => useContext(ToastContext);

    // --- Leaflet地図表示 ---
    function LeafletMap({ spots = [], selectedSpotId, onSelectSpot, height = "360px" }) {
      const mapRef = useRef(null);
      const mapInstance = useRef(null);
      const markersRef = useRef([]);

      useEffect(() => {
        if (!mapRef.current) return;
        if (!mapInstance.current) {
          const map = L.map(mapRef.current).setView([35.6812, 139.7671], 13);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 19
          }).addTo(map);
          mapInstance.current = map;
        }
        return () => {
          if (mapInstance.current) {
            mapInstance.current.remove();
            mapInstance.current = null;
          }
        };
      }, []);

      useEffect(() => {
        const map = mapInstance.current;
        if (!map) return;
        markersRef.current.forEach(m => m.remove());
        markersRef.current = [];

        const validSpots = spots.filter(s => s.lat && s.lng);
        if (validSpots.length === 0) return;

        const bounds = [];
        validSpots.forEach((s, idx) => {
          const lat = Number(s.lat);
          const lng = Number(s.lng);
          bounds.push([lat, lng]);

          const cat = CATEGORY_MAP[s.category] || CATEGORY_MAP.other;
          const isSelected = selectedSpotId === (s.schedule_id || s.wish_id);
          const iconHtml = `
            <div style="
              background-color: ${cat.color};
              color: #fff;
              width: ${isSelected ? '32px' : '26px'};
              height: ${isSelected ? '32px' : '26px'};
              border-radius: 50% 50% 50% 0;
              transform: rotate(-45deg);
              display: flex;
              align-items: center;
              justify-content: center;
              border: 2px solid #fff;
              box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            ">
              <span style="transform: rotate(45deg); font-size: 11px; font-weight: bold;">${s.spot_order || idx + 1}</span>
            </div>
          `;
          const customIcon = L.divIcon({
            className: 'custom-pin',
            html: iconHtml,
            iconSize: [30, 30],
            iconAnchor: [15, 30],
            popupAnchor: [0, -30]
          });

          const marker = L.marker([lat, lng], { icon: customIcon }).addTo(map);
          marker.bindPopup(`<b>${s.spot_name}</b><br><span style="font-size:11px;color:#666">${s.address || ''}</span>`);
          if (onSelectSpot) {
            marker.on('click', () => onSelectSpot(s.schedule_id || s.wish_id));
          }
          markersRef.current.push(marker);
        });

        if (bounds.length === 1) map.setView(bounds[0], 15);
        else if (bounds.length > 1) map.fitBounds(bounds, { padding: [40, 40] });
      }, [spots, selectedSpotId]);

      return (
        <div className="relative w-full rounded-xl overflow-hidden border border-[#E8E4DE]" style={{ height }}>
          <div ref={mapRef} className="w-full h-full" />
        </div>
      );
    }

    // --- プラン新規作成ページ ---
    function PlanNewPage({ onNavigate }) {
      const [title, setTitle] = useState('');
      const [date, setDate] = useState(() => {
        const d = new Date();
        d.setDate(d.getDate() + 4);
        return normalizeDateStr(d);
      });
      const [startTime, setStartTime] = useState('11:00');
      const [prefecture, setPrefecture] = useState('東京都');
      const [area, setArea] = useState('');
      const [budgetLimit, setBudgetLimit] = useState(15000);
      const [themes, setThemes] = useState(['カフェ', '散策']);
      const [description, setDescription] = useState('');
      const [submitting, setSubmitting] = useState(false);
      const { showToast } = useToast();

      const toggleTheme = (t) => {
        setThemes(prev => prev.includes(t) ? prev.filter(x => x !== t) : [...prev, t]);
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!title.trim() || !date) return;
        setSubmitting(true);
        try {
          const res = await savePlan({
            title: title.trim(),
            date: normalizeDateStr(date),
            start_time: normalizeTimeStr(startTime),
            prefecture,
            area: area.trim(),
            budget_limit: Number(budgetLimit) || 0,
            theme: themes.join(','),
            description: description.trim(),
            status: 'planned'
          });
          if (res.success && res.data) {
            showToast('基本情報を保存しました！スポットを登録しましょう');
            onNavigate(`/plan/${res.data.plan_id}/spots`);
          }
        } catch (err) {
          showToast('保存に失敗しました', 'error');
        } finally {
          setSubmitting(false);
        }
      };

      return (
        <div className="max-w-2xl mx-auto px-4 sm:px-6 py-6 sm:py-8 space-y-6">
          <div className="flex items-center justify-between text-xs text-[#6B6560] pb-2 border-b border-[#E8E4DE]">
            <span className="font-semibold text-[#B85C4F]">1. 基本情報入力</span>
            <span>2. スポット登録</span>
            <span>3. スケジュール調整</span>
          </div>

          <div>
            <h1 className="text-2xl sm:text-3xl font-bold text-[#2D2A26] font-serif">新しいデートプランを作成</h1>
            <p className="text-xs sm:text-sm text-[#6B6560] mt-1">日程やエリア、予算などの基本情報を設定します</p>
          </div>

          <form onSubmit={handleSubmit} className="bg-white rounded-2xl border border-[#E8E4DE] p-6 sm:p-8 space-y-5 text-xs">
            <div>
              <label className="block font-semibold text-[#2D2A26] mb-1">デートタイトル <span className="text-[#C44D3D]">*</span></label>
              <input
                type="text"
                required
                placeholder="例: 渋谷・原宿 秋のカフェ＆夜景デート"
                value={title}
                onChange={e => setTitle(e.target.value)}
                className="w-full px-3.5 py-2.5 rounded-lg border border-[#E8E4DE] focus:border-[#B85C4F] focus:outline-none"
              />
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label className="block font-semibold text-[#2D2A26] mb-1">デート日 <span className="text-[#C44D3D]">*</span></label>
                <input
                  type="date"
                  required
                  value={date}
                  onChange={e => setDate(e.target.value)}
                  className="w-full px-3.5 py-2.5 rounded-lg border border-[#E8E4DE] focus:border-[#B85C4F] focus:outline-none bg-white"
                />
              </div>
              <div>
                <label className="block font-semibold text-[#2D2A26] mb-1">開始時刻</label>
                <input
                  type="time"
                  value={startTime}
                  onChange={e => setStartTime(e.target.value)}
                  className="w-full px-3.5 py-2.5 rounded-lg border border-[#E8E4DE] focus:border-[#B85C4F] focus:outline-none bg-white"
                />
              </div>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label className="block font-semibold text-[#2D2A26] mb-1">エリア（都道府県）</label>
                <select
                  value={prefecture}
                  onChange={e => setPrefecture(e.target.value)}
                  className="w-full px-3.5 py-2.5 rounded-lg border border-[#E8E4DE] focus:border-[#B85C4F] focus:outline-none bg-white"
                >
                  {PREFECTURES.map(p => <option key={p} value={p}>{p}</option>)}
                </select>
              </div>
              <div>
                <label className="block font-semibold text-[#2D2A26] mb-1">エリア詳細</label>
                <input
                  type="text"
                  placeholder="例: 渋谷・代官山"
                  value={area}
                  onChange={e => setArea(e.target.value)}

                />
              </div>
            </div>

            <div>
              <label className="block font-semibold text-[#2D2A26] mb-1">予算上限（2人合計）</label>
              <input
                type="number"
                min="0"
                step="1000"
                value={budgetLimit || ''}
                onChange={e => setBudgetLimit(parseInt(e.target.value, 10) || 0)}
                className="w-full px-3.5 py-2.5 rounded-lg border border-[#E8E4DE] focus:border-[#B85C4F] focus:outline-none tabular-nums font-semibold"
              />
            </div>

            <div>
              <label className="block font-semibold text-[#2D2A26] mb-2">テーマ</label>
              <div className="flex flex-wrap gap-2">
                {THEMES.map(t => {
                  const active = themes.includes(t);
                  return (
                    <button
                      key={t}
                      type="button"
                      onClick={() => toggleTheme(t)}
                      className={`px-3 py-1.5 rounded-lg text-xs font-medium border transition-colors ${active ? 'bg-[#B85C4F] border-[#B85C4F] text-white' : 'bg-[#F5F3EF] border-[#E8E4DE] text-[#6B6560]'}`}
                    >
                      {t}
                    </button>
                  );
                })}
              </div>
            </div>

            <div>
              <label className="block font-semibold text-[#2D2A26] mb-1">メモ・ふたりの意気込み</label>
              <textarea
                rows="2"
                placeholder="行きたかったお店でゆっくり過ごす！"
                value={description}
                onChange={e => setDescription(e.target.value)}
                className="w-full px-3.5 py-2 rounded-lg border border-[#E8E4DE] focus:border-[#B85C4F] focus:outline-none"
              />
            </div>

            <div className="flex justify-between items-center pt-4 border-t border-[#E8E4DE]">
              <button type="button" onClick={() => onNavigate('/plans')} className="px-4 py-2 text-[#6B6560] hover:text-[#2D2A26]">一覧へ戻る</button>
              <button
                type="submit"
                disabled={submitting}
                className="px-6 py-2.5 font-semibold text-white bg-[#B85C4F] hover:bg-[#9A4D42] rounded-lg shadow-sm"
              >
                次へ（スポット登録） →
              </button>
            </div>
          </form>
        </div>
      );
    }

    // --- スポット登録画面 (修正要件2 & 5: Wishlist自動追加) ---
    function SpotRegisterPage({ planId, onNavigate }) {
      const [plan, setPlan] = useState(null);
      const [spots, setSpots] = useState([]);
      const [wishlist, setWishlist] = useState([]);
      const [loading, setLoading] = useState(true);
      const [modalOpen, setModalOpen] = useState(false);
      const [editSpot, setEditSpot] = useState(null);
      const { showToast } = useToast();

      useEffect(() => {
        Promise.all([getPlan(planId), getSchedule(planId), getWishlist()]).then(([p, s, w]) => {
          setPlan(p);
          setSpots(s);
          setWishlist(w);
          setLoading(false);
        });
      }, [planId]);

      const handleSaveSpot = async (spotData) => {
        if (!plan) return;
        try {
          if (editSpot) {
            const updated = spots.map(s => s.schedule_id === editSpot.schedule_id ? { ...s, ...spotData } : s);
            const res = await saveSchedule(planId, updated, plan.start_time);
            setSpots(res.data);
            showToast('スポットを更新しました');
          } else {
            const res = await addSpot(planId, spotData, plan.start_time);
            setSpots(res);
            showToast('スポットを追加しました（行きたいリストにも連動登録）');
          }
          setModalOpen(false);
          setEditSpot(null);
        } catch (e) {
          showToast('スポット保存に失敗しました', 'error');
        }
      };

      const handleDeleteSpot = async (scheduleId) => {
        if (!plan) return;
        const res = await deleteSpot(planId, scheduleId, plan.start_time);
        setSpots(res);
        showToast('スポットを削除しました', 'info');
      };

      const handleAddWish = async (wish) => {
        if (!plan) return;
        const res = await addSpot(planId, {
          start_time: '12:00',
          duration_min: 60,
          transit_min: 15,
          spot_name: wish.spot_name,
          category: wish.category,
          address: wish.address || '',
          lat: wish.lat,
          lng: wish.lng,
          budget_per_person: wish.estimated_budget_per_person || 0,
          budget_for_two: wish.estimated_budget_for_two || 0,
          budget_input_type: wish.budget_input_type || 'per_person',
          memo: wish.memo || '',
          image_url: wish.image_url || '',
          url: wish.url || '',
          has_reservation: false
        }, plan.start_time);
        setSpots(res);
        showToast(`「${wish.spot_name}」を追加しました！`);
      };

      if (loading) return <div className="py-16 text-center text-xs text-[#6B6560]">読み込み中...</div>;
      if (!plan) return <div className="py-16 text-center text-xs text-[#C44D3D]">プランが見つかりませんでした</div>;

      return (
        <div className="max-w-6xl mx-auto px-4 sm:px-6 py-6 sm:py-8 space-y-6">
          <div className="flex items-center justify-between text-xs text-[#6B6560] pb-2 border-b border-[#E8E4DE]">
            <button onClick={() => onNavigate(`/plan/${planId}/edit`)} className="hover:text-[#2D2A26]">✓ 1. 基本情報</button>
            <span className="font-semibold text-[#B85C4F]">2. スポット登録</span>
            <button onClick={() => onNavigate(`/plan/${planId}/schedule`)} className="hover:text-[#2D2A26]">3. スケジュール調整</button>
          </div>

          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h1 className="text-2xl sm:text-3xl font-bold text-[#2D2A26] font-serif">立ち寄るスポットを登録</h1>
              <p className="text-xs sm:text-sm text-[#6B6560] mt-1">{plan.title}（{formatDateJP(plan.date)}）で訪れる場所</p>
            </div>
            <button
              onClick={() => { setEditSpot(null); setModalOpen(true); }}
              className="flex items-center gap-1.5 px-4 py-2.5 text-xs sm:text-sm font-semibold text-white bg-[#B85C4F] hover:bg-[#9A4D42] rounded-xl shadow-xs"
            >
              <Icon name="plus" className="w-4 h-4" />
              <span>スポットを新規追加</span>
            </button>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            <div className="lg:col-span-7 space-y-6">
              <div className="bg-white rounded-2xl border border-[#E8E4DE] p-5 space-y-4 shadow-xs">
                <h2 className="text-base font-bold text-[#2D2A26] font-serif">登録済みスポット ({spots.length}件)</h2>
                {spots.length === 0 ? (
                  <p className="text-xs text-[#6B6560] py-6 text-center border-2 border-dashed border-[#E8E4DE] rounded-xl">
                    スポットがまだありません。「スポットを新規追加」または下の「行きたいリスト」から選んで追加してください。
                  </p>
                ) : (

    // --- スケジュール調整画面 ---
    function ScheduleEditPage({ planId, onNavigate }) {
      const [plan, setPlan] = useState(null);
      const [spots, setSpots] = useState([]);
      const [budgetMode, setBudgetMode] = useState('for_two');
      const [loading, setLoading] = useState(true);
      const [modalOpen, setModalOpen] = useState(false);
      const [editSpot, setEditSpot] = useState(null);
      const { showToast } = useToast();

      useEffect(() => {
        Promise.all([getPlan(planId), getSchedule(planId)]).then(([p, s]) => {
          setPlan(p);
          setSpots(recalculateSchedule(s, p?.start_time || '11:00'));
          setLoading(false);
        });
      }, [planId]);

      const moveOrder = async (index, direction) => {
        const target = direction === 'up' ? index - 1 : index + 1;
        if (target < 0 || target >= spots.length) return;
        const reordered = [...spots];
        const temp = reordered[index];
        reordered[index] = reordered[target];
        reordered[target] = temp;
        const res = await saveSchedule(planId, reordered, plan.start_time);
        setSpots(res.data);
      };

      const changeTransit = async (index, mins) => {
        const updated = spots.map((s, idx) => idx === index ? { ...s, transit_min: mins } : s);
        const res = await saveSchedule(planId, updated, plan.start_time);
        setSpots(res.data);
      };

      const handleSaveSpot = async (spotData) => {
        let updated = [];
        if (editSpot) {
          updated = spots.map(s => s.schedule_id === editSpot.schedule_id ? { ...s, ...spotData } : s);
        } else {
          updated = [...spots, { ...spotData, schedule_id: generateId('sch'), spot_order: spots.length + 1 }];
        }
        const res = await saveSchedule(planId, updated, plan.start_time);
        setSpots(res.data);
        setModalOpen(false);
        setEditSpot(null);
        showToast('スケジュールを更新しました');
      };

      const handleDeleteSpot = async (scheduleId) => {
        const res = await deleteSpot(planId, scheduleId, plan.start_time);
        setSpots(res);
        showToast('スポットを削除しました', 'info');
      };

      const finishSchedule = () => {
        if (typeof confetti === 'function') {
          confetti({ particleCount: 70, spread: 60, origin: { y: 0.6 } });
        }
        showToast('デートのしおりが完成しました！🎉');
        setTimeout(() => onNavigate(`/plan/${planId}`), 400);
      };

      if (loading) return <div className="py-16 text-center text-xs text-[#6B6560]">読み込み中...</div>;
      if (!plan) return <div className="py-16 text-center text-xs text-[#C44D3D]">プランが見つかりませんでした</div>;

      return (
        <div className="max-w-4xl mx-auto px-4 sm:px-6 py-6 sm:py-8 space-y-6">
          <div className="flex items-center justify-between text-xs text-[#6B6560] pb-2 border-b border-[#E8E4DE]">
            <button onClick={() => onNavigate(`/plan/${planId}/edit`)} className="hover:text-[#2D2A26]">✓ 1. 基本情報</button>
            <button onClick={() => onNavigate(`/plan/${planId}/spots`)} className="hover:text-[#2D2A26]">✓ 2. スポット登録</button>
            <span className="font-semibold text-[#B85C4F]">3. スケジュール調整</span>
          </div>

          <div>
            <span className="text-xs text-[#6B6560]">{formatDateJP(plan.date)} {plan.start_time}開始</span>
            <h1 className="text-2xl sm:text-3xl font-bold text-[#2D2A26] font-serif">{plan.title}</h1>
          </div>

          <BudgetBar spots={spots} budgetLimit={plan.budget_limit} budgetMode={budgetMode} onChangeMode={setBudgetMode} />

          <div className="space-y-4">
            <div className="flex items-center justify-between">
              <h2 className="text-base font-bold text-[#2D2A26] font-serif">当日のタイムライン（自動計算）</h2>
              <button
                onClick={() => { setEditSpot(null); setModalOpen(true); }}
                className="px-3 py-1.5 text-xs font-semibold text-[#B85C4F] border border-[#B85C4F] rounded-lg hover:bg-[#B85C4F]/10"
              >
                + スポット追加
              </button>
            </div>

            <div className="space-y-3">
              {spots.map((s, idx) => {
                const endTime = addMinutesToTime(s.start_time, s.duration_min);
                const isLast = idx === spots.length - 1;
                const bVal = budgetMode === 'for_two' ? s.budget_for_two : s.budget_per_person;

                return (
                  <div key={s.schedule_id} className="space-y-2">
                    <div className="bg-white rounded-xl border border-[#E8E4DE] p-4 sm:p-5 shadow-xs flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                      <div className="space-y-1 flex-1">
                        <div className="flex items-center gap-2 text-xs">
                          <span className="font-bold text-[#B85C4F] bg-[#F5F3EF] px-2 py-0.5 rounded">{s.start_time} 〜 {endTime}</span>
                          <CategoryBadge category={s.category} showName />
                          {s.has_reservation && <span className="text-[10px] text-[#5A8F7B] bg-[#5A8F7B]/10 px-1.5 py-0.5 rounded font-semibold">予約あり</span>}
                        </div>
                        <h3 className="text-base font-bold text-[#2D2A26]">{s.spot_name}</h3>
                        {s.address && <p className="text-xs text-[#6B6560] truncate">{s.address}</p>}
                        {s.memo && <p className="text-xs text-[#6B6560] bg-[#F5F3EF] p-2 rounded mt-1">{s.memo}</p>}
                      </div>

                      <div className="flex items-center sm:flex-col items-end gap-2 pt-2 sm:pt-0 border-t sm:border-t-0 border-[#E8E4DE]">
                        <div className="text-right text-xs">
                          <span className="font-bold text-[#2D2A26] tabular-nums">{formatYen(bVal)}</span>
                          <span className="text-[#6B6560] text-[10px] ml-1">({budgetMode === 'for_two' ? '2人分' : '1人分'})</span>
                          <div className="text-[11px] text-[#6B6560]">滞在: {s.duration_min}分</div>
                        </div>

                        <div className="flex items-center gap-1">
                          <button
                            type="button"
                            disabled={idx === 0}
                            onClick={() => moveOrder(idx, 'up')}
                            className="p-1 text-[#6B6560] hover:text-[#2D2A26] disabled:opacity-30"
                            title="上へ"
                          >
                            <Icon name="arrowUp" className="w-3.5 h-3.5" />
                          </button>
                          <button
                            type="button"
                            disabled={isLast}
                            onClick={() => moveOrder(idx, 'down')}
                            className="p-1 text-[#6B6560] hover:text-[#2D2A26] disabled:opacity-30"
                            title="下へ"
                          >
                            <Icon name="arrowDown" className="w-3.5 h-3.5" />
                          </button>
                          <button
                            type="button"
                            onClick={() => { setEditSpot(s); setModalOpen(true); }}
                            className="p-1 text-[#6B6560] hover:text-[#2D2A26]"
                            title="編集"
                          >
                            <Icon name="edit" className="w-3.5 h-3.5" />
                          </button>
                          <button
                            type="button"
                            onClick={() => handleDeleteSpot(s.schedule_id)}
                            className="p-1 text-[#6B6560] hover:text-[#C44D3D]"
                            title="削除"
                          >
                            <Icon name="trash" className="w-3.5 h-3.5" />
                          </button>
                        </div>
                      </div>
                    </div>

                    {!isLast && (
                      <div className="flex items-center gap-2 px-6 py-0.5 text-xs text-[#6B6560]">
                        <span className="w-0.5 h-4 bg-[#E8E4DE] ml-2" />
                        <span className="text-[11px] bg-[#F5F3EF] px-2 py-0.5 rounded-full border border-[#E8E4DE]">
                          次の場所へ移動:
                          <select
                            value={s.transit_min !== undefined ? s.transit_min : 15}
                            onChange={e => changeTransit(idx, Number(e.target.value))}
                            className="bg-transparent font-bold text-[#2D2A26] ml-1 focus:outline-none"
                          >
                            {[0, 5, 10, 15, 20, 25, 30, 45, 60].map(m => (
                              <option key={m} value={m}>{m}分</option>
                            ))}
                          </select>
                        </span>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>

          <div className="flex justify-between items-center pt-6 border-t border-[#E8E4DE]">
            <button onClick={() => onNavigate(`/plan/${planId}/spots`)} className="px-4 py-2 text-xs text-[#6B6560]">← 前へ（スポット登録）</button>
            <button
              onClick={finishSchedule}
              className="px-8 py-3 text-xs sm:text-sm font-semibold text-white bg-[#B85C4F] hover:bg-[#9A4D42] rounded-xl shadow-md"
            >
              しおりを完成させる 🎉
            </button>
          </div>

          <SpotModal
            isOpen={modalOpen}
            spot={editSpot}
            onClose={() => { setModalOpen(false); setEditSpot(null); }}
            onSave={handleSaveSpot}
          />
        </div>
      );
    }

    // --- 持ち物チェックリスト ---
    function DateChecklist({ planId }) {
      const [list, setList] = useState([]);
      const [loading, setLoading] = useState(true);
      const [newTitle, setNewTitle] = useState('');
      const [assignee, setAssignee] = useState('彼氏');
      const { showToast } = useToast();

      useEffect(() => {
        getChecklist(planId).then(data => {
          setList(data);
          setLoading(false);
        });
      }, [planId]);

      const handleToggle = async (item) => {
        const next = !item.is_checked;
        const res = await toggleChecklistItem(planId, item.id, next);
        setList(res);
      };

      const handleAdd = async (e) => {
        e.preventDefault();
        if (!newTitle.trim()) return;
        const res = await addChecklistItem(planId, { title: newTitle.trim(), assignee });
        setList(res);
        setNewTitle('');
        showToast('持ち物を追加しました');
      };

      const handleDelete = async (id) => {
        const res = await deleteChecklistItem(planId, id);
        setList(res);
      };

      const handleAddPresets = async () => {
        const res = await addPresetsToChecklist(planId, PRESET_CHECKLIST_ALL);
        setList(res);
        showToast('おすすめ持ち物を一括追加しました');
      };

      const checkedCount = list.filter(i => i.is_checked).length;
      const rate = list.length > 0 ? Math.round((checkedCount / list.length) * 100) : 0;

      return (
        <div className="bg-white rounded-2xl border border-[#E8E4DE] p-5 space-y-4 shadow-xs">
          <div className="flex items-center justify-between">
            <div>
              <h3 className="text-base font-bold text-[#2D2A26] font-serif">持ち物チェックリスト ({checkedCount}/{list.length})</h3>
              <p className="text-xs text-[#6B6560] mt-0.5">準備完了: {rate}%</p>
            </div>
            <button onClick={handleAddPresets} className="text-xs text-[#B85C4F] hover:underline font-semibold">+ 定番アイテム一括追加</button>
          </div>

          <div className="w-full bg-[#F5F3EF] h-2 rounded-full overflow-hidden">
            <div className="h-full bg-[#5A8F7B] transition-all" style={{ width: `${rate}%` }} />
          </div>

          <form onSubmit={handleAdd} className="flex gap-2 text-xs">
            <input
              type="text"
              placeholder="新しい持ち物を追加"
              value={newTitle}
              onChange={e => setNewTitle(e.target.value)}
              className="flex-1 px-3 py-2 rounded-lg border border-[#E8E4DE] focus:border-[#B85C4F] focus:outline-none"
            />
            <select
              value={assignee}
              onChange={e => setAssignee(e.target.value)}
              className="px-2.5 py-2 rounded-lg border border-[#E8E4DE] bg-white"
            >
              <option value="彼氏">彼氏</option>
              <option value="彼女">彼女</option>
              <option value="2人共通">2人共通</option>
            </select>
            <button type="submit" className="px-4 py-2 bg-[#B85C4F] text-white rounded-lg font-semibold shrink-0">追加</button>
          </form>

          <div className="divide-y divide-[#E8E4DE]">
            {list.map(item => (
              <div key={item.id} className="py-2.5 flex items-center justify-between text-xs">
                <label className="flex items-center gap-2.5 cursor-pointer flex-1 min-w-0 pr-2">
                  <input
                    type="checkbox"
                    checked={item.is_checked}
                    onChange={() => handleToggle(item)}
                    className="w-4 h-4 accent-[#5A8F7B] rounded"
                  />
                  <span className={`truncate ${item.is_checked ? 'line-through text-[#6B6560]' : 'text-[#2D2A26] font-medium'}`}>
                    {item.title}
                  </span>
                  <span className="text-[10px] px-1.5 py-0.5 rounded bg-[#F5F3EF] text-[#6B6560] shrink-0">{item.assignee}</span>

              </div>
            ))}
          </div>
        </div>
      );
    }

      const year = date.getFullYear();
      const month = date.getMonth();
      const firstDay = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();
      const currentMonthKey = `${year}-${String(month + 1).padStart(2, '0')}`;

      const currentMonthPlans = plans.filter(p => p.date && p.date.startsWith(currentMonthKey));

      return (
        <div className="max-w-4xl mx-auto px-4 sm:px-6 py-6 sm:py-8 space-y-6">

              <button onClick={() => setDate(new Date(year, month - 1, 1))} className="p-1 hover:text-[#B85C4F]">◀</button>
              <span>{year}年 {month + 1}月</span>
              <button onClick={() => setDate(new Date(year, month + 1, 1))} className="p-1 hover:text-[#B85C4F]">▶</button>
            </div>
          </div>

          <div className="bg-white rounded-2xl border border-[#E8E4DE] p-4 shadow-xs">
            <div className="grid grid-cols-7 text-center text-xs font-bold py-2 border-b border-[#E8E4DE]">
              <span className="text-[#C44D3D]">日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span className="text-[#5A7D8C]">土</span>
            </div>
            <div className="grid grid-cols-7 gap-1 pt-2">
              {Array.from({ length: firstDay }).map((_, i) => (
                <div key={`empty-${i}`} className="min-h-[60px] p-1 bg-[#F5F3EF]/30 rounded-lg" />
              ))}
              {Array.from({ length: lastDate }).map((_, i) => {
                const day = i + 1;
                const dKey = `${currentMonthKey}-${String(day).padStart(2, '0')}`;
                const matched = plans.filter(p => p.date === dKey);
                return (
                  <div key={`day-${day}`} className="min-h-[60px] p-1.5 rounded-lg border border-[#E8E4DE]/50 bg-white flex flex-col justify-between">
                    <span className="text-[11px] font-bold text-[#2D2A26]">{day}</span>

                        >
                          {p.title}
                        </button>
                      ))}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    // --- メインアプリケーション & ルーター ---
    function App() {
      const getHashPath = () => window.location.hash.replace(/^#/, '') || '/';
      const [path, setPath] = useState(getHashPath);

      useEffect(() => {
        const handleHash = () => setPath(getHashPath());
        window.addEventListener('hashchange', handleHash);
        return () => window.removeEventListener('hashchange', handleHash);
      }, []);

      const navigate = (newPath) => {
        window.location.hash = newPath;
        setPath(newPath);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const renderPage = () => {
        if (path === '/' || path === '') return <TopPage onNavigate={navigate} />;
        if (path === '/plans') return <PlanListPage onNavigate={navigate} />;
        if (path === '/plan/new') return <PlanNewPage onNavigate={navigate} />;
        if (path === '/wishlist') return <WishlistPage onNavigate={navigate} />;
        if (path === '/history') return <HistoryPage onNavigate={navigate} />;
        if (path === '/settings') return <SettingsPage />;

        let m = path.match(/^\/plan\/([^/]+)\/spots$/);
        if (m) return <SpotRegisterPage planId={m[1]} onNavigate={navigate} />;

        m = path.match(/^\/plan\/([^/]+)\/schedule$/);
        if (m) return <ScheduleEditPage planId={m[1]} onNavigate={navigate} />;

        m = path.match(/^\/plan\/([^/]+)$/);
        if (m) return <PlanViewPage planId={m[1]} onNavigate={navigate} />;

        return <TopPage onNavigate={navigate} />;
      };

      return (
        <ToastProvider>
          <div className="min-h-screen flex flex-col bg-[#F5F3EF] text-[#2D2A26]">
            <Header currentPath={path} onNavigate={navigate} />
            <main className="flex-1 pb-16">{renderPage()}</main>
            <Footer onNavigate={navigate} />
          </div>
        </ToastProvider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
